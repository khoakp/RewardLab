{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 3rem auto;">
  <div class="card">
    <h1 class="card-title" style="text-align: center; margin-bottom: 0.5rem;" data-testid="login-header">Sign in to RewardLab</h1>
    <p style="text-align: center; color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem;">
      Use synthetic test credentials (e.g. <code>test_01</code> / <code>test_password_01</code>).
    </p>

    {% if error %}
    <div class="alert alert-danger" data-testid="login-error-alert" role="alert">
      {{ error }}
    </div>
    {% endif %}

    <form action="/login" method="post">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          class="form-input" 
          data-testid="username-input" 
          aria-label="Username" 
          required 
          autocomplete="username"
          placeholder="e.g. test_01"
          value="{{ username or '' }}"
        >
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-input" 
          data-testid="password-input" 
          aria-label="Password" 
          required 
          autocomplete="current-password"
          placeholder="Enter test password"
        >
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;" data-testid="login-submit-btn" aria-label="Sign in">
        Sign in
      </button>
    </form>
  </div>
</div>
{% endblock %}
